[project]
name = "del-academic-navigator"
version = "0.2.0"
description = "Enterprise AI Copilot untuk Layanan Bimbingan Akademik dan Penjadwalan Ulang Kuliah Kampus Institut Teknologi Del"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tim Pengembang Del-Academic Navigator", email = "academic-navigator@del.ac.id" }
]
keywords = [
    "artificial-intelligence",
    "academic-scheduling",
    "search-algorithms",
    "a-star",
    "uniform-cost-search",
    "del-academic-navigator",
    "institut-teknologi-del"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "chromadb>=0.4.22",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pypdf>=3.0.0",
    "pytest>=8.0.0",
    "reportlab>=3.6.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
]

[project.scripts]
del-nav = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "src"]
